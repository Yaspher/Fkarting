<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>FKarting — Test de Conexión Dinámico</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<style>
    :root {
        --bg:#080808; --card:#0e0e0e; --border:rgba(127,29,29,0.30);
        --red:#dc2626; --red-dark:#7f1d1d; --green:#16a34a; --yellow:#ca8a04;
        --blue:#2563eb; --purple:#9333ea;
        --white:#fff; --gray-400:#9ca3af; --gray-600:#4b5563;
        --font:'Courier New', monospace;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:var(--gray-400); font-family:var(--font);
           font-size:13px; padding:32px 24px; min-height:100vh; }

    header { display:flex; align-items:center; justify-content:space-between;
             margin-bottom:28px; padding-bottom:16px; border-bottom:1px solid var(--border);
             flex-wrap:wrap; gap:12px; }
    .title { color:var(--white); font-size:18px; font-weight:bold;
             letter-spacing:2px; text-transform:uppercase; }
    .title span { color:var(--red); }

    .btn-run { background:var(--red); color:var(--white); border:none;
               padding:10px 24px; border-radius:6px; font-family:var(--font);
               font-size:13px; font-weight:bold; cursor:pointer;
               letter-spacing:1px; text-transform:uppercase; transition:background .15s; }
    .btn-run:hover { background:#b91c1c; }
    .btn-run:disabled { opacity:.5; cursor:not-allowed; }

    .summary { display:flex; gap:12px; margin-bottom:24px; flex-wrap:wrap; }
    .summary-pill { padding:6px 14px; border-radius:20px; font-size:12px;
                    font-weight:bold; letter-spacing:1px; }
    .pill-ok    { background:rgba(22,163,74,.15);  color:#4ade80; border:1px solid var(--green); }
    .pill-err   { background:rgba(220,38,38,.15);  color:#f87171; border:1px solid var(--red); }
    .pill-empty { background:rgba(202,138,4,.15);  color:#facc15; border:1px solid var(--yellow); }
    .pill-new   { background:rgba(37,99,235,.15);  color:#60a5fa; border:1px solid var(--blue); }
    .pill-miss  { background:rgba(147,51,234,.15); color:#c084fc; border:1px solid var(--purple); }
    .pill-total { background:rgba(255,255,255,.05); color:var(--gray-400); border:1px solid var(--gray-600); }

    .group-title { color:var(--gray-600); font-size:10px; letter-spacing:3px;
                   text-transform:uppercase; margin:24px 0 10px; }

    .test-card { background:var(--card); border:1px solid var(--border);
                 border-radius:8px; margin-bottom:8px; overflow:hidden;
                 transition:border-color .2s; }
    .test-card.ok    { border-color:rgba(22,163,74,.4); }
    .test-card.err   { border-color:rgba(220,38,38,.5); }
    .test-card.empty { border-color:rgba(202,138,4,.4); }
    .test-card.new   { border-color:rgba(37,99,235,.5); }
    .test-card.miss  { border-color:rgba(147,51,234,.5); }

    .test-header { display:flex; align-items:center; gap:12px; padding:12px 16px;
                   width:100%; border:0; color:inherit; font:inherit;
                   text-align:left; cursor:pointer; user-select:none; }
    .test-header:hover { background:rgba(255,255,255,.02); }

    .status-icon { font-size:16px; flex-shrink:0; width:22px; text-align:center; }
    .test-name   { color:var(--white); font-weight:bold; font-size:13px; flex:1; }
    .test-meta   { display:flex; gap:12px; align-items:center; flex-shrink:0; }

    .badge { padding:2px 8px; border-radius:4px; font-size:11px;
             background:rgba(255,255,255,.06); color:var(--gray-400); }
    .badge.empty { background:rgba(202,138,4,.15); color:#facc15; }
    .badge.new   { background:rgba(37,99,235,.15); color:#60a5fa; }
    .badge.miss  { background:rgba(147,51,234,.15); color:#c084fc; }
    .badge-time  { color:var(--gray-600); font-size:11px; min-width:52px; text-align:right; }

    .chevron { color:var(--gray-600); font-size:11px; transition:transform .2s; flex-shrink:0; }
    .test-card.open .chevron { transform:rotate(180deg); }

    .test-detail { display:none; padding:0 16px 14px; border-top:1px solid rgba(255,255,255,.04); }
    .test-card.open .test-detail { display:block; }

    .detail-section { margin-top:10px; }
    .detail-label { color:var(--gray-600); font-size:10px; letter-spacing:2px;
                    text-transform:uppercase; margin-bottom:5px; }
    .columns-list { display:flex; flex-wrap:wrap; gap:5px; }
    .col-pill { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08);
                color:#93c5fd; padding:2px 8px; border-radius:4px; font-size:11px; }
    .col-pill.pk { color:#fcd34d; border-color:rgba(252,211,77,.3); }

    .error-box { background:rgba(127,29,29,.2); border:1px solid var(--red-dark);
                 border-radius:6px; padding:10px 12px; color:#fca5a5;
                 font-size:12px; line-height:1.5; word-break:break-word; margin-top:8px; }
    .info-box  { background:rgba(37,99,235,.1); border:1px solid rgba(37,99,235,.5);
                 border-radius:6px; padding:10px 12px; color:#93c5fd;
                 font-size:12px; line-height:1.5; margin-top:8px; }

    .sample-table { width:100%; border-collapse:collapse; font-size:11px; margin-top:6px; }
    .sample-table th { color:var(--gray-600); text-align:left; padding:4px 8px;
                       border-bottom:1px solid rgba(255,255,255,.06); white-space:nowrap; }
    .sample-table td { color:var(--gray-400); padding:4px 8px;
                       border-bottom:1px solid rgba(255,255,255,.03);
                       max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .sample-table tr:last-child td { border-bottom:none; }

    .spinner { display:inline-block; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }

    a.back { display:inline-block; margin-top:32px; color:var(--gray-600);
             text-decoration:none; font-size:12px; border:1px solid rgba(127,29,29,.2);
             padding:6px 14px; border-radius:6px; transition:color .15s,border-color .15s; }
    a.back:hover { color:var(--white); border-color:rgba(127,29,29,.5); }

    .config-warning { background:rgba(202,138,4,.1); border:1px solid var(--yellow);
                      color:#fde047; padding:12px 16px; border-radius:6px;
                      margin-bottom:20px; font-size:12px; line-height:1.6; }

    .schema-stats { display:flex; gap:20px; flex-wrap:wrap; padding:14px 18px;
                    background:var(--card); border:1px solid var(--border);
                    border-radius:8px; margin-bottom:20px; font-size:12px; }
    .schema-stats strong { color:var(--white); }
    .run-status { min-height:18px; margin:-12px 0 18px; color:var(--gray-600); font-size:11px; }
    .null-value { color:var(--gray-600); }
    .probe-panel { margin-bottom:20px; padding:14px 18px; background:var(--card);
                   border:1px solid var(--border); border-radius:8px; }
    .probe-panel label { display:block; margin-bottom:8px; color:var(--white);
                         font-weight:bold; }
    .probe-controls { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .probe-controls input { flex:1 1 280px; min-width:0; padding:8px 10px;
                            border:1px solid var(--gray-600); border-radius:5px;
                            background:var(--bg); color:var(--white);
                            font:inherit; }
    .probe-controls span { flex:2 1 320px; color:var(--gray-600); font-size:11px; }
    @media (max-width:600px) {
        body { padding:20px 12px; }
        .test-header { align-items:flex-start; padding:11px 12px; }
        .test-meta { gap:6px; flex-wrap:wrap; justify-content:flex-end; }
        .badge-time { min-width:auto; }
        .sample-table { min-width:480px; }
    }
</style>
</head>
<body>

<header>
    <div class="title">🔌 <span>FK</span>arting — Test Dinámico</div>
    <button class="btn-run" id="btnRun" type="button">▶ Ejecutar Tests</button>
</header>

<div id="config-warning"></div>
<div id="schema-stats"></div>
<div id="run-status" class="run-status" role="status" aria-live="polite"></div>
<section class="probe-panel" aria-labelledby="probe-title">
    <label id="probe-title" for="extra-entities">Entidades adicionales a verificar</label>
    <div class="probe-controls">
        <input id="extra-entities" type="text"
               placeholder="ej.: nueva_tabla, nueva_vista"
               autocomplete="off">
        <span>Sepáralas por coma. La Data API no permite listar automáticamente
            todas las tablas y vistas.</span>
    </div>
</section>

<div class="summary" id="summary" style="display:none">
    <span class="summary-pill pill-total" id="pillTotal">—</span>
    <span class="summary-pill pill-ok"    id="pillOk">— OK</span>
    <span class="summary-pill pill-empty" id="pillEmpty">— Vacías</span>
    <span class="summary-pill pill-err"   id="pillErr">— Errores</span>
    <span class="summary-pill pill-new"   id="pillNew">— Nuevas</span>
    <span class="summary-pill pill-miss"  id="pillMiss">— Faltantes</span>
</div>

<div id="output"></div>

<a href="admin.html" class="back">← Volver al inicio</a>

<script>
// ── Configuración ────────────────────────────────────────────
const SUPABASE_URL = "https://kgzqqaxhqcydrvzqnxmk.supabase.co";
const SUPABASE_KEY = "sb_publishable_svTNXiFYYvt9mZy1eXf_Gg_NXMoVvhg";

const HEADERS = {
    "Content-Type":  "application/json",
    "apikey":        SUPABASE_KEY,
    "Authorization": `Bearer ${SUPABASE_KEY}`
};

const TIMEOUT_MS = 8000;

// ── Esquema esperado (basado en tu documentación) ────────────
// Esta lista se verifica directamente contra la Data API.
const ESPERADO = {
    tablas: [
        "piloto", "campeonato", "carrera", "resultado",
        "ranking", "tablapuntosbase", "estados"
    ],
    vistas: [
        "vista_carrera", "vista_piloto", "vista_pilotos_legendarios",
        "vista_ranking", "vista_tiempos",
        "vista_top5_global", "vista_top5_ultima_carrera"
    ]
};

// ── Validación de config ─────────────────────────────────────
(function validateConfig() {
    const warnEl = document.getElementById("config-warning");
    const problemas = [];
    try {
        const url = new URL(SUPABASE_URL);
        if (url.protocol !== "https:") problemas.push("SUPABASE_URL debe usar HTTPS.");
    } catch {
        problemas.push("SUPABASE_URL inválida.");
    }
    if (!SUPABASE_KEY || SUPABASE_KEY.length < 20) problemas.push("SUPABASE_KEY inválida.");
    if (problemas.length) {
        warnEl.innerHTML = `<div class="config-warning">
            ⚠️ <strong>Configuración incompleta:</strong>
            <ul style="margin-top:6px; padding-left:20px;">
                ${problemas.map(p => `<li>${p}</li>`).join("")}
            </ul>
        </div>`;
    }
})();

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[character]));
}

function errorMessage(error) {
    return error instanceof Error ? error.message : String(error);
}

// ── Fetch con timeout ────────────────────────────────────────
async function fetchConTimeout(url, options = {}) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
    try {
        return await fetch(url, { ...options, signal: ctrl.signal });
    } finally {
        clearTimeout(t);
    }
}

// ── Verificación exclusivamente mediante la Data API ─────────
async function descubrirEsquema() {
    const adicionales = document.getElementById("extra-entities").value
        .split(",")
        .map(nombre => nombre.trim())
        .filter(Boolean);
    const entidades = [
        ...ESPERADO.tablas.map(nombre => ({ nombre, tipo: "tabla" })),
        ...ESPERADO.vistas.map(nombre => ({ nombre, tipo: "vista" })),
        ...adicionales
            .filter(nombre => !ESPERADO.tablas.includes(nombre) && !ESPERADO.vistas.includes(nombre))
            .map(nombre => ({ nombre, tipo: "nueva" }))
    ];
    const resultados = await Promise.all(entidades.map(async entidad => {
        const res = await fetchConTimeout(
            `${SUPABASE_URL}/rest/v1/${encodeURIComponent(entidad.nombre)}?select=*&limit=1`,
            { headers: HEADERS }
        );
        if (!res.ok) return { nombre: entidad.nombre, tipo: entidad.tipo, encontrada: false };
        const data = await res.json();
        return {
            nombre: entidad.nombre,
            columnas: data.length ? Object.keys(data[0]) : [],
            raw: {},
            tipo: entidad.tipo,
            encontrada: true
        };
    }));
    return {
        tablas: resultados.filter(item => item?.tipo === "tabla" && item.encontrada),
        vistas: resultados.filter(item => item?.tipo === "vista" && item.encontrada),
        nuevas: resultados.filter(item => item?.tipo === "nueva"),
        spec: null
    };
}

// ── Test individual contra un endpoint ───────────────────────
async function testEndpoint(nombre) {
    const t0 = performance.now();
    try {
        const res = await fetchConTimeout(
            `${SUPABASE_URL}/rest/v1/${nombre}?select=*&limit=3`,
            { headers: HEADERS }
        );
        const ms = Math.round(performance.now() - t0);
        if (!res.ok) {
            const txt = await res.text();
            let msg = txt;
            try { msg = JSON.parse(txt).message ?? txt; } catch {}
            if (res.status === 401) {
                msg = "API key rechazada por Supabase (401). Actualiza SUPABASE_KEY.";
            }
            return { ok:false, ms, error:msg, rows:0, columns:[], sample:[] };
        }
        const data = await res.json();
        const columns = data.length ? Object.keys(data[0]) : [];
        return { ok:true, ms, rows:data.length, columns, sample:data };
    } catch (err) {
        const ms = Math.round(performance.now() - t0);
        return {
            ok:false,
            ms,
            error: err.name === "AbortError"
                ? `La solicitud superó el tiempo límite de ${TIMEOUT_MS} ms.`
                : errorMessage(err),
            rows:0,
            columns:[],
            sample:[]
        };
    }
}

// ── Render ───────────────────────────────────────────────────
function renderCard(item, result, id) {
    // item = { nombre, tipo: 'tabla'|'vista', estado: 'ok'|'new'|'miss', columnasEsperadas? }
    const estado = item.estado;
    let icon = "⏳", cls = "", badge = "";

    if (estado === "miss") {
        icon = "⚠️"; cls = "miss";
        badge = `<span class="badge miss">NO EXISTE</span>`;
    } else if (result === null) {
        icon = `<span class="spinner">⟳</span>`;
    } else if (!result.ok) {
        icon = "❌"; cls = "err";
        badge = `<span class="badge">${result.rows} filas</span>`;
    } else if (result.rows === 0) {
        icon = "🟡"; cls = "empty";
        badge = `<span class="badge empty">VACÍA</span>`;
    } else {
        icon = "✅"; cls = estado === "new" ? "new" : "ok";
        badge = `<span class="badge">${result.rows} fila${result.rows!==1?"s":""}</span>`;
    }

    if (estado === "new" && result?.ok && result.rows > 0) {
        badge += ` <span class="badge new">NUEVA</span>`;
    }

    const time = result !== null && estado !== "miss"
        ? `<span class="badge-time">${result.ms}ms</span>` : "";

    // Detalle
    let detail = "";
    if (estado === "miss") {
        detail = `<div class="info-box">
            🆕 Esta ${item.tipo} fue indicada para la prueba pero <strong>no responde</strong>
            en la Data API. Verifica que exista, esté expuesta en el esquema <code>public</code>
            y que sus permisos RLS permitan la consulta.
        </div>`;
    } else if (result !== null) {
        if (result.ok) {
            const cols = (result.columns.length ? result.columns : item.columnasEsperadas ?? [])
                .map(c => `<span class="col-pill">${escapeHTML(c)}</span>`).join("");
            const headers = (result.columns.length ? result.columns : item.columnasEsperadas ?? [])
                .map(c => `<th>${escapeHTML(c)}</th>`).join("");
            const sampleRows = (result.sample ?? []).slice(0, 2).map(row => {
                const cells = (result.columns.length ? result.columns : [])
                    .map(c => {
                        const v = row[c];
                        const d = v === null ? '<span class="null-value">null</span>'
                              : escapeHTML(String(v).length > 30 ? String(v).slice(0,30)+"…" : v);
                        return `<td>${d}</td>`;
                    }).join("");
                return `<tr>${cells}</tr>`;
            }).join("");

            detail = `
                <div class="detail-section">
                    <div class="detail-label">Columnas (${result.columns.length || item.columnasEsperadas?.length || 0})</div>
                    <div class="columns-list">${cols}</div>
                </div>
                ${result.sample?.length ? `
                <div class="detail-section" style="margin-top:12px">
                    <div class="detail-label">Muestra</div>
                    <div style="overflow-x:auto">
                        <table class="sample-table">
                            <thead><tr>${headers}</tr></thead>
                            <tbody>${sampleRows}</tbody>
                        </table>
                    </div>
                </div>` : `
                <div class="info-box" style="margin-top:12px">
                    La ${item.tipo} existe pero está vacía. Las columnas se detectaron
                    desde la definición esperada: ${(item.columnasEsperadas ?? []).length} columnas.
                </div>`}`;
        } else {
            detail = `<div class="error-box">⚠️ ${escapeHTML(result.error)}</div>`;
        }
    }

    return `
        <div class="test-card ${cls}" id="card-${id}">
            <div class="test-header" role="button" tabindex="0" aria-expanded="false"
                 aria-controls="detail-${id}" data-card-id="${id}">
                <span class="status-icon">${icon}</span>
                <span class="test-name">${escapeHTML(item.nombre)}</span>
                <div class="test-meta">
                    ${badge}
                    ${time}
                    <span class="chevron">▼</span>
                </div>
            </div>
            <div class="test-detail" id="detail-${id}">${detail}</div>
        </div>`;
}

function toggleCard(header) {
    const card = header.closest(".test-card");
    const isOpen = card.classList.toggle("open");
    header.setAttribute("aria-expanded", String(isOpen));
}

// ── Main ─────────────────────────────────────────────────────
document.getElementById("btnRun").addEventListener("click", async () => {
    const btn = document.getElementById("btnRun");
    btn.disabled = true;
    btn.textContent = "⟳ Ejecutando...";
    document.getElementById("run-status").textContent = "Conectando con Supabase…";

    const output      = document.getElementById("output");
    const summary     = document.getElementById("summary");
    const statsEl     = document.getElementById("schema-stats");
    output.innerHTML  = "";
    summary.style.display = "none";
    statsEl.innerHTML = "";

    try {
    // ── 1. Descubrir esquema ─────────────────────────────────
    let descubierto;
    try {
        descubierto = await descubrirEsquema();
    } catch (err) {
        output.innerHTML = `<div class="error-box">
            ❌ No se pudo verificar la conexión con la Data API de Supabase.<br>
            <strong>Error:</strong> ${escapeHTML(errorMessage(err))}<br>
            Verifica que la URL y la API key sean correctas y que el proyecto esté activo.
        </div>`;
        return;
    }

    const nombresReales = new Set([
        ...descubierto.tablas.map(t => t.nombre),
        ...descubierto.vistas.map(v => v.nombre)
    ]);

    // ── 2. Comparar contra esquema esperado ──────────────────
    const esperadasTablas = new Set(ESPERADO.tablas);
    const esperadasVistas = new Set(ESPERADO.vistas);

    const items = [];

    // Tablas reales
    for (const t of descubierto.tablas) {
        items.push({
            nombre: t.nombre,
            tipo: "tabla",
            estado: esperadasTablas.has(t.nombre) ? "ok" : "new",
            columnasEsperadas: t.columnas
        });
    }
    // Vistas reales
    for (const v of descubierto.vistas) {
        items.push({
            nombre: v.nombre,
            tipo: "vista",
            estado: esperadasVistas.has(v.nombre) ? "ok" : "new",
            columnasEsperadas: v.columnas
        });
    }
    for (const entidad of descubierto.nuevas) {
        items.push({
            nombre: entidad.nombre,
            tipo: "entidad",
            estado: entidad.encontrada ? "new" : "miss",
            columnasEsperadas: entidad.columnas ?? []
        });
    }
    // Faltantes (esperadas pero no existen)
    for (const t of ESPERADO.tablas) {
        if (!nombresReales.has(t)) items.push({ nombre: t, tipo: "tabla", estado: "miss" });
    }
    for (const v of ESPERADO.vistas) {
        if (!nombresReales.has(v)) items.push({ nombre: v, tipo: "vista", estado: "miss" });
    }

    // Ordenar: ok → new → miss, y dentro de cada uno alfabético
    const orden = { ok: 0, new: 1, miss: 2 };
    items.sort((a,b) => orden[a.estado] - orden[b.estado] || a.nombre.localeCompare(b.nombre));

    // ── 3. Mostrar stats del descubrimiento ──────────────────
    statsEl.innerHTML = `
        <div class="schema-stats">
            <span>🔎 <strong>Descubiertas:</strong> ${descubierto.tablas.length} tablas · ${descubierto.vistas.length} vistas</span>
            <span>📋 <strong>Esperadas:</strong> ${ESPERADO.tablas.length} tablas · ${ESPERADO.vistas.length} vistas</span>
            <span>📦 <strong>Total a testear:</strong> ${items.length}</span>
        </div>`;
    statsEl.insertAdjacentHTML("beforeend", `
        <div class="info-box">
            La verificación se realizó exclusivamente mediante la Data API.
            Para revisar una tabla o vista nueva, escríbela arriba y vuelve a ejecutar.
        </div>`);

    // ── 4. Ejecutar tests ────────────────────────────────────
    let contadores = { ok:0, empty:0, err:0, new:0, miss:0 };
    let cardId = 0;

    // Agrupar
    const grupos = {
        "✅ Esperadas — OK":    items.filter(i => i.estado === "ok"),
        "🆕 Nuevas (no documentadas)": items.filter(i => i.estado === "new"),
        "⚠️ Faltantes (esperadas y no existen)": items.filter(i => i.estado === "miss")
    };

    for (const [titulo, lista] of Object.entries(grupos)) {
        if (!lista.length) continue;

        const groupEl = document.createElement("div");
        groupEl.innerHTML = `<div class="group-title">${titulo} · ${lista.length}</div>`;
        output.appendChild(groupEl);

        // Placeholders
        const wrappers = {};
        for (const item of lista) {
            const id = `c${cardId++}`;
            const wrap = document.createElement("div");
            wrap.id = `wrapper-${id}`;
            wrap.innerHTML = renderCard(item, null, id);
            groupEl.appendChild(wrap);
            wrappers[item.nombre + item.tipo] = { id, item };
        }

        // Ejecutar
        for (const item of lista) {
            const { id } = wrappers[item.nombre + item.tipo];

            if (item.estado === "miss") {
                contadores.miss++;
                document.getElementById(`wrapper-${id}`).innerHTML =
                    renderCard(item, null, id);
                continue;
            }

            const result = await testEndpoint(item.nombre);
            if (!result.ok) contadores.err++;
            else if (result.rows === 0) contadores.empty++;
            else if (item.estado === "new") contadores.new++;
            else contadores.ok++;

            document.getElementById(`wrapper-${id}`).innerHTML =
                renderCard(item, result, id);
        }
    }

    // ── 5. Resumen ───────────────────────────────────────────
    const total = contadores.ok + contadores.empty + contadores.err
                + contadores.new + contadores.miss;
    document.getElementById("pillTotal").textContent = `${total} entidades`;
    document.getElementById("pillOk").textContent    = `${contadores.ok} OK`;
    document.getElementById("pillEmpty").textContent = `${contadores.empty} vacías`;
    document.getElementById("pillErr").textContent   = `${contadores.err} errores`;
    document.getElementById("pillNew").textContent   = `${contadores.new} nuevas`;
    document.getElementById("pillMiss").textContent  = `${contadores.miss} faltantes`;
    summary.style.display = "flex";
    document.getElementById("run-status").textContent =
        `Diagnóstico completado: ${total} entidades revisadas.`;
    } finally {
        btn.disabled = false;
        btn.textContent = "↺ Repetir Tests";
    }
});

document.getElementById("output").addEventListener("click", event => {
    const header = event.target.closest(".test-header");
    if (header) toggleCard(header);
});

document.getElementById("output").addEventListener("keydown", event => {
    const header = event.target.closest(".test-header");
    if (header && (event.key === "Enter" || event.key === " ")) {
        event.preventDefault();
        toggleCard(header);
    }
});
</script>

</body>
</html>
