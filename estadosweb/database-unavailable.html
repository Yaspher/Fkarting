<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080808">
    <title>Servicio temporalmente no disponible — FKarting</title>
    <link rel="icon" type="image/x-icon" href="../img/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <main class="db-outage">
        <section class="db-outage-card" aria-labelledby="outage-title">

                <img class="db-outage-logo" src="../img/fkarting-logo-principal.png" alt="FKarting">

            <div class="db-outage-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <ellipse cx="12" cy="5" rx="8" ry="3"/>
                    <path d="M4 5v14c0 1.66 3.58 3 8 3s8-1.34 8-3V5M4 12c0 1.2 1.65 2.25 4 2.75M16 14.75c2.35-.5 4-1.55 4-2.75M12 8v5"/>

            <a class="btn-primary" href="../index.html">Intentar de nuevo</a>
